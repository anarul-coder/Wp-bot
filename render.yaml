services:
  - type: web
    name: whatsapp-python-ai-bot
    runtime: python
    plan: starter        # persistent disk requires a paid plan
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: PIWAPP_AUTH_FILE
        value: /var/data/whatsapp/auth.json
      - key: ALLOWED_PHONE_NUMBER
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: DASHBOARD_TOKEN
        sync: false
    disk:
      name: whatsapp-session
      mountPath: /var/data
      sizeGB: 1
